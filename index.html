<!DOCTYPE html>
<html lang="en">
<head>

    <title>My Multimedia Page</title>

    <link rel="stylesheet" href="style.css">
</head>

    <header>

        <section class="media-section">
            <h2>Favourite Photos</h2>

                <img src="solo.jfif" alt="Favourite Photo 4">

        </section>


        <!-- AUDIO -->

        <section class="media-section">

            <div class="audios">

                    <source src="[30 seconds] Unravel - Tokyo Ghoul OP [TMVy44TegsY].mp3" type="audio/mpeg">
